name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: IPFizzy

          filename: github-metrics.svg
          template: classic
          config_display: columns
          config_timezone: America/Los_Angeles

          # Keep the general information professional.
          base: header, activity

          # Exclude the outdated portfolio from language calculations.
          repositories_skipped: |
            IPFizzy/ipfizzy.github.io

          # Three-dimensional contribution calendar.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Programming language activity.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%

          # Coding times and recent habits.
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          # Deliberately selected portfolio projects.
          plugin_repositories: yes
          plugin_repositories_featured: >-
            IPFizzy/umoja-pamoja-website,
            IPFizzy/PcTroubleshooter
