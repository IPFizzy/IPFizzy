name: Update GitHub Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: update-github-profile
  cancel-in-progress: true

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Generate the main Lowlighter Metrics dashboard.
      # This action commits github-metrics.svg to the repository.
      # ---------------------------------------------------------
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: IPFizzy

          filename: github-metrics.svg
          template: classic
          config_display: columns
          config_timezone: America/Los_Angeles

          base: header, activity, community, repositories, metadata

          repositories_skipped: |
            IPFizzy/ipfizzy.github.io

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          plugin_repositories: yes
          plugin_repositories_featured: >-
            IPFizzy/umoja-pamoja-website,
            IPFizzy/PcTroubleshooter

      # Metrics commits first, so check out the newest main branch afterward.
      - name: Check out updated profile repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Create card directory
        run: mkdir -p profile

      # ---------------------------------------------------------
      # Generate and store GitHub trophies locally.
      # Multiple official-listed mirrors are tried as fallbacks.
      # ---------------------------------------------------------
      - name: Generate GitHub trophies
        shell: bash
        run: |
          set -euo pipefail

          TROPHY_QUERY="username=IPFizzy&theme=darkhub&no-frame=true&no-bg=true&column=6&margin-w=8&margin-h=8"

          TROPHY_ENDPOINTS=(
            "https://github-profile-trophy.vercel.app/"
            "https://github-profile-trophy-liard-delta.vercel.app/"
            "https://gh-trophy.cdnsoft.net/"
            "https://trophy.ryglcloud.net/"
          )

          generated=false

          for endpoint in "${TROPHY_ENDPOINTS[@]}"; do
            echo "Trying trophy endpoint: ${endpoint}"

            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 2 \
              --retry-delay 3 \
              --connect-timeout 15 \
              --max-time 60 \
              "${endpoint}?${TROPHY_QUERY}" \
              --output /tmp/github-trophies.svg; then

              if grep -q "<svg" /tmp/github-trophies.svg; then
                mv /tmp/github-trophies.svg profile/github-trophies.svg
                echo "GitHub trophies generated successfully."
                generated=true
                break
              fi
            fi
          done

          if [ "$generated" = false ]; then
            if [ -f profile/github-trophies.svg ]; then
              echo "All trophy endpoints failed. Keeping the existing trophy image."
            else
              echo "No trophy image exists and every endpoint failed."
              exit 1
            fi
          fi

      # ---------------------------------------------------------
      # Generate the local GitHub statistics card.
      # ---------------------------------------------------------
      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=IPFizzy&show_icons=true&include_all_commits=true&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9&icon_color=F2CC60&rank_icon=github"
          path: profile/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ---------------------------------------------------------
      # Generate featured repository cards.
      # ---------------------------------------------------------
      - name: Generate Umoja Pamoja card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=IPFizzy&repo=umoja-pamoja-website&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9&icon_color=F2CC60&description_lines_count=2"
          path: profile/umoja-pamoja.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate PC Troubleshooter card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=IPFizzy&repo=PcTroubleshooter&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9&icon_color=F2CC60&description_lines_count=2"
          path: profile/pc-troubleshooter.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ---------------------------------------------------------
      # Commit all locally generated README cards.
      # ---------------------------------------------------------
      - name: Commit generated profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "README cards are already current."
            exit 0
          fi

          git commit -m "Update GitHub profile cards"
          git pull --rebase origin main
          git push
